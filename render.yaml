databases:
  - name: hackathon-db
    databaseName: hackathon
    user: hackathon_user
    plan: free

services:
  - type: web
    name: hackathon-api
    env: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-db
          property: connectionString
