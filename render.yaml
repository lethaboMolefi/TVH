databases:
  - name: hackathon-db
    databaseName: hackathon
    user: hackathon_user
    plan: free

services:
  - type: web
    name: hackathon-api
    env: docker
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hackathon-db
          property: connectionString

  - type: web
    name: hackathon-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: hackathon-api
          envVarKey: RENDER_EXTERNAL_URL
